name: Build and deploy static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests
      - run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages publication source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            if (data.build_type !== 'workflow') {
              core.setFailed('Settings → Pages → Source must be GitHub Actions. Deploy from a branch runs Jekyll and can overwrite the generated archive. Change Source, then run this workflow again.');
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
